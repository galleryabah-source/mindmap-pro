name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "hardening/**", "ci/**", "security/**"]
  pull_request:
    branches: [main, "feat/**", "security/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  database:
    name: Supabase migration and pgTAP tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Start isolated local database and apply migrations
        run: supabase db start
      - name: Run pgTAP schema and security tests
        run: supabase test db
  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm CLI
        run: |
          npm install --global npm@11
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high

  web:
    name: Web lint, types, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm CLI
        run: |
          npm install --global npm@11
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
