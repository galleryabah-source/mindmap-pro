name: Generate dependency lockfile
run-name: Generate and validate npm lockfile

on:
  workflow_dispatch:
  push:
    branches: ["security/vitest-patched-release"]

permissions:
  contents: write

concurrency:
  group: generate-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lockfile:
    name: Resolve, validate, and commit npm lockfile
    if: github.repository == 'galleryabah-source/mindmap-pro' && github.ref == 'refs/heads/security/vitest-patched-release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: security/vitest-patched-release
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm CLI
        run: |
          npm install --global npm@11
          npm --version
      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate lockfile with clean install
        run: npm ci --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && git diff --quiet -- package-lock.json; then
            echo "Tracked package-lock.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "build: add validated npm lockfile"
          git push origin HEAD:security/vitest-patched-release
