name: Generate dependency lockfile artifact

on:
  push:
    branches: ["security/vitest-patched-release"]

permissions:
  contents: read

jobs:
  generate-lockfile:
    name: Resolve and package npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm CLI
        run: |
          npm install --global npm@11
          npm --version
      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate lockfile with clean install
        run: npm ci --ignore-scripts
      - name: Upload package-lock.json
        uses: actions/upload-artifact@v4
        with:
          name: mindmap-pro-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
